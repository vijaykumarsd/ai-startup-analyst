steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/ai-analyst-agent-472807/ai-analyst-frontend:${_TAG_NAME}', '.']

  # Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/ai-analyst-agent-472807/ai-analyst-frontend:${_TAG_NAME}']

  # Deploy the image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run',
      'deploy',
      'ai-analyst-frontend', # Service name in Cloud Run
      '--image',
      'gcr.io/ai-analyst-agent-472807/ai-analyst-frontend:${_TAG_NAME}',
      '--region',
      'us-central1',
      '--platform',
      'managed',
      '--allow-unauthenticated', # Adjust based on your authentication needs
      '--project',
      'ai-analyst-agent-472807'
    ]

substitutions:
  _TAG_NAME: 'latest' # Default tag, you can override this when triggering the build

images:
  - 'gcr.io/ai-analyst-agent-472807/ai-analyst-frontend:${_TAG_NAME}'
